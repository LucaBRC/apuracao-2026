<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Apuração ao vivo</title>
<style>
  :root { --bg:#0f1115; --card:#181b22; --line:#2a2f3a; --txt:#e8eaf0; --mut:#8b93a5; --ok:#22c55e; --a:#ef4444; --b:#3b82f6; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--txt); font:14px/1.4 system-ui, Segoe UI, sans-serif; }
  header { display:flex; flex-wrap:wrap; gap:12px; align-items:center; justify-content:space-between; padding:12px 16px; border-bottom:1px solid var(--line); }
  h1 { font-size:18px; margin:0; }
  .mut { color:var(--mut); font-size:12px; }
  .wrap { display:grid; grid-template-columns: minmax(0,1.3fr) minmax(300px,1fr); gap:16px; padding:16px; }
  @media (max-width:900px) { .wrap { grid-template-columns:1fr; } }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px; }
  svg { width:100%; height:auto; display:block; }
  path.uf { stroke:#0f1115; stroke-width:1; cursor:pointer; }
  path.uf:hover { stroke:#fff; stroke-width:2; }
  text.lbl { font-size:11px; font-weight:700; fill:#fff; text-anchor:middle; pointer-events:none; paint-order:stroke; stroke:#000a; stroke-width:3px; }
  .big { font-size:34px; font-weight:800; }
  .bar { height:10px; background:#2a2f3a; border-radius:6px; overflow:hidden; }
  .bar > i { display:block; height:100%; background:var(--ok); transition:width .6s; }
  .cands { display:flex; gap:10px; margin-top:12px; }
  .cand { flex:1; padding:10px; border-radius:8px; background:#11141a; border-left:4px solid; }
  .cand b { font-size:22px; display:block; }
  .h2h { display:flex; height:14px; border-radius:7px; overflow:hidden; margin-top:10px; }
  .reg { display:grid; grid-template-columns: 100px 1fr 56px; gap:8px; align-items:center; margin:8px 0; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  td, th { padding:4px 6px; border-bottom:1px solid var(--line); text-align:right; }
  td:first-child, th:first-child { text-align:left; }
  th { color:var(--mut); font-weight:500; cursor:pointer; }
  .tabs button { background:#11141a; color:var(--txt); border:1px solid var(--line); padding:6px 10px; border-radius:6px; cursor:pointer; }
  .tabs button.on { background:#2a2f3a; border-color:#555; }
  #tip { position:fixed; pointer-events:none; background:#000d; border:1px solid #444; border-radius:8px; padding:8px 10px; font-size:13px; display:none; z-index:9; }
  .leg { display:flex; align-items:center; gap:6px; margin-top:8px; }
  .leg i { display:inline-block; width:120px; height:10px; border-radius:5px; }
  .err { color:#f87171; }
  #sel { margin-top:10px; padding:10px; border-radius:8px; background:#11141a; font-size:14px; }
  #sel:empty { display:none; }
  /* claude---(mobile) */
  @media (max-width:600px) {
    header { padding:10px 12px; }
    h1 { font-size:16px; }
    .wrap { padding:10px; gap:10px; }
    .card { padding:10px; }
    .tabs { display:flex; flex-wrap:wrap; gap:6px; width:100%; }
    .tabs button { flex:1; padding:10px 8px; font-size:14px; }
    .tabs .mut { width:100%; text-align:right; }
    text.lbl { font-size:19px; stroke-width:4px; }
    text.lbl.mini { display:none; }
    .big { font-size:30px; }
    .cand b { font-size:19px; }
    .reg { grid-template-columns: 92px 1fr 56px; }
    td, th { padding:6px 4px; }
    #tip { display:none !important; }
  }
</style>
</head>
<body>
<header>
  <div>
    <h1>Presidente · 2º turno · apuração ao vivo</h1>
    <div class="mut">Fonte: resultados.tse.jus.br · <span id="hora">carregando…</span></div>
  </div>
  <div class="tabs">
    <button id="mApu" class="on">Cor: % apurado</button>
    <button id="mLid">Cor: quem lidera</button>
    <span class="mut" id="cont"></span>
  </div>
</header>

<div class="wrap">
  <div class="card">
    <svg id="mapa"></svg>
    <div class="leg mut" id="leg"></div>
    <div id="sel"></div>
  </div>
  <div style="display:flex;flex-direction:column;gap:16px">
    <div class="card">
      <div class="mut">Brasil (inclui exterior) — seções totalizadas</div>
      <div class="big" id="brPct">–</div>
      <div class="bar"><i id="brBar" style="width:0"></i></div>
      <div class="mut" id="brSec"></div>
      <div class="cands" id="brCands"></div>
      <div class="h2h" id="brH2h"></div>
    </div>
    <div class="card">
      <div class="mut" style="margin-bottom:4px">Apurado por região</div>
      <div id="regs"></div>
    </div>
    <div class="card">
      <div class="mut" style="margin-bottom:4px">Por estado</div>
      <table><thead><tr><th data-k="uf">UF</th><th data-k="pst">Apurado</th><th data-k="c0">c0</th><th data-k="c1">c1</th></tr></thead><tbody id="tab"></tbody></table>
    </div>
  </div>
</div>
<div id="tip"></div>

<script src="mapa.js"></script>
<script>
const BASE = 'https://resultados.tse.jus.br/oficial/ele2026/6258/dados/';
const REGIOES = {
  'Norte': ['AC','AM','AP','PA','RO','RR','TO'],
  'Nordeste': ['AL','BA','CE','MA','PB','PE','PI','RN','SE'],
  'Centro-Oeste': ['DF','GO','MS','MT'],
  'Sudeste': ['ES','MG','RJ','SP'],
  'Sul': ['PR','RS','SC'],
};
const UFS = Object.values(REGIOES).flat();
const NOMES = {AC:'Acre',AL:'Alagoas',AM:'Amazonas',AP:'Amapá',BA:'Bahia',CE:'Ceará',DF:'Distrito Federal',ES:'Espírito Santo',GO:'Goiás',MA:'Maranhão',MG:'Minas Gerais',MS:'Mato Grosso do Sul',MT:'Mato Grosso',PA:'Pará',PB:'Paraíba',PE:'Pernambuco',PI:'Piauí',PR:'Paraná',RJ:'Rio de Janeiro',RN:'Rio Grande do Norte',RO:'Rondônia',RR:'Roraima',RS:'Rio Grande do Sul',SC:'Santa Catarina',SE:'Sergipe',SP:'São Paulo',TO:'Tocantins'};
const COR_CAND = {'13':'#ef4444','22':'#3b82f6'};
const INTERVALO = 30;
let dados = {}, modo = 'apu', ordem = {k:'uf', d:1}, ordemCand = [];

const num = s => parseFloat(String(s ?? '0').replace(',', '.')) || 0;
const fmt = n => n.toLocaleString('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:2}) + '%';

function decodeJws(txt) {
  let p = txt.trim().split('.')[1].replace(/-/g,'+').replace(/_/g,'/');
  p += '='.repeat((4 - p.length % 4) % 4);
  const bin = atob(p), bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return JSON.parse(new TextDecoder('iso-8859-1').decode(bytes));
}

function resumir(d) {
  const cands = [];
  for (const a of d.carg[0].agr) for (const p of a.par) for (const c of p.cand)
    cands.push({n:c.n, nome:c.nmu, pct:num(c.pvapn ?? c.pvap), votos:+c.vap});
  cands.sort((a,b) => a.n.localeCompare(b.n));
  return { ts:+d.s.ts, st:+d.s.st, pst:num(d.s.pstn ?? d.s.pst), cands, hora:`${d.dg} ${d.hg}` };
}

async function baixar(uf) {
  const r = await fetch(`${BASE}${uf}/${uf}-c0001-e006258-u.jws?nocache=${Date.now()}`, {cache:'no-store'});
  if (!r.ok) throw new Error(uf + ' HTTP ' + r.status);
  return resumir(decodeJws(await r.text()));
}

async function atualizar() {
  const alvos = ['br', ...UFS.map(u => u.toLowerCase())];
  const res = await Promise.allSettled(alvos.map(baixar));
  let falhas = 0;
  res.forEach((r, i) => { if (r.status === 'fulfilled') dados[alvos[i].toUpperCase()] = r.value; else falhas++; });
  const br = dados.BR;
  document.getElementById('hora').innerHTML = br
    ? `totalização TSE: ${br.hora} · consultado às ${new Date().toLocaleTimeString('pt-BR')}` + (falhas ? ` · <span class="err">${falhas} falha(s)</span>` : '')
    : '<span class="err">sem dados do TSE</span>';
  desenhar();
}

function corApu(p) {
  if (p <= 0) return '#3a3f4b';
  const t = Math.sqrt(p / 100); // raiz: diferencia melhor os valores baixos do começo da apuração
  const lerp = (a,b) => Math.round(a + (b-a)*t);
  return `rgb(${lerp(150,22)},${lerp(70,197)},${lerp(30,94)})`; // laranja escuro → verde
}
function corLid(d) {
  if (!d || !d.st) return '#3a3f4b';
  const [a, b] = [...d.cands].sort((x,y) => y.pct - x.pct);
  const forca = Math.min(1, 0.35 + (a.pct - (b ? b.pct : 0)) / 30);
  const hex = COR_CAND[a.n] || '#a3a3a3';
  return hex + Math.round(forca * 255).toString(16).padStart(2,'0');
}

function montarMapa() {
  const svg = document.getElementById('mapa');
  svg.setAttribute('viewBox', `0 0 ${MAPA_W} ${MAPA_H}`);
  let h = '';
  for (const uf of UFS) h += `<path class="uf" id="p_${uf}" data-uf="${uf}" d="${MAPA[uf]}"/>`;
  svg.innerHTML = h;
  for (const uf of UFS) {
    const bb = document.getElementById('p_' + uf).getBBox();
    const off = {DF:[0,0],RN:[8,0],PB:[10,0],PE:[14,4],AL:[8,2],SE:[6,2],ES:[6,0],RJ:[4,4],SC:[0,2]}[uf] || [0,0];
    svg.insertAdjacentHTML('beforeend',
      `<text class="lbl${MINI.includes(uf) ? ' mini' : ''}" id="t_${uf}" x="${bb.x + bb.width/2 + off[0]}" y="${bb.y + bb.height/2 + off[1]}">${uf}</text>`);
  }
  const tip = document.getElementById('tip');
  svg.addEventListener('mousemove', e => {
    const uf = e.target.dataset?.uf;
    if (!uf) { tip.style.display = 'none'; return; }
    tip.innerHTML = infoUf(uf);
    tip.style.display = 'block';
    tip.style.left = Math.min(e.clientX + 14, innerWidth - 240) + 'px';
    tip.style.top = (e.clientY + 14) + 'px';
  });
  svg.addEventListener('mouseleave', () => tip.style.display = 'none');
  // claude---(mobile): toque num estado mostra o detalhe abaixo do mapa
  svg.addEventListener('click', e => {
    selecionado = e.target.dataset?.uf || null;
    document.querySelectorAll('path.uf').forEach(p => p.style.stroke = p.dataset.uf === selecionado ? '#fff' : '');
    mostrarSel();
  });
}

const MINI = ['RN','PB','PE','AL','SE','DF','ES','RJ'];
let selecionado = null;
function infoUf(uf) {
  const d = dados[uf];
  return `<b>${NOMES[uf]}</b><br>Apurado: <b>${d ? fmt(d.pst) : '–'}</b>` +
    (d ? `<br><span class="mut">${d.st.toLocaleString('pt-BR')} de ${d.ts.toLocaleString('pt-BR')} seções</span>` +
      d.cands.map(c => `<br><span style="color:${COR_CAND[c.n]||'#ccc'}">●</span> ${c.nome}: ${fmt(c.pct)}`).join('') : '');
}
function mostrarSel() {
  document.getElementById('sel').innerHTML = selecionado ? infoUf(selecionado) : '';
}

function desenhar() {
  for (const uf of UFS) {
    const d = dados[uf];
    const el = document.getElementById('p_' + uf);
    el.style.fill = modo === 'apu' ? corApu(d ? d.pst : 0) : corLid(d);
    document.getElementById('t_' + uf).textContent = d ? `${uf} ${Math.floor(d.pst)}%` : uf;
  }
  mostrarSel();
  const cands = dados.BR?.cands || [];
  ordemCand = cands;
  document.getElementById('leg').innerHTML = modo === 'apu'
    ? `0% <i style="background:linear-gradient(90deg,${corApu(0.01)},${corApu(100)})"></i> 100% · <span style="color:#9aa">cinza = nada apurado</span>`
    : cands.map(c => `<span style="color:${COR_CAND[c.n]}">●</span> ${c.nome}`).join(' &nbsp; ') + ' · cor mais forte = vantagem maior';

  const br = dados.BR;
  if (br) {
    document.getElementById('brPct').textContent = fmt(br.pst);
    document.getElementById('brBar').style.width = br.pst + '%';
    document.getElementById('brSec').textContent = `${br.st.toLocaleString('pt-BR')} de ${br.ts.toLocaleString('pt-BR')} seções`;
    document.getElementById('brCands').innerHTML = br.cands.map(c =>
      `<div class="cand" style="border-color:${COR_CAND[c.n]||'#888'}"><span class="mut">${c.n} · ${c.nome}</span><b>${fmt(c.pct)}</b><span class="mut">${c.votos.toLocaleString('pt-BR')} votos</span></div>`).join('');
    document.getElementById('brH2h').innerHTML = br.cands.map(c =>
      `<div style="width:${c.pct}%;background:${COR_CAND[c.n]||'#888'}"></div>`).join('');
  }

  let hr = '';
  for (const [reg, ufs] of Object.entries(REGIOES)) {
    let ts = 0, st = 0;
    for (const u of ufs) if (dados[u]) { ts += dados[u].ts; st += dados[u].st; }
    const p = ts ? st / ts * 100 : 0;
    hr += `<div class="reg"><span>${reg}</span><div class="bar"><i style="width:${p}%"></i></div><b style="text-align:right">${fmt(p)}</b></div>`;
  }
  document.getElementById('regs').innerHTML = hr;

  const ths = document.querySelectorAll('th');
  ths[2].textContent = cands[0]?.nome || '';
  ths[3].textContent = cands[1]?.nome || '';
  const linhas = UFS.map(uf => {
    const d = dados[uf] || {pst:0, cands:[]};
    return {uf, pst:d.pst, c0:d.cands[0]?.pct ?? 0, c1:d.cands[1]?.pct ?? 0};
  }).sort((a,b) => (a[ordem.k] > b[ordem.k] ? 1 : a[ordem.k] < b[ordem.k] ? -1 : 0) * ordem.d);
  document.getElementById('tab').innerHTML = linhas.map(l =>
    `<tr><td>${l.uf}</td><td>${fmt(l.pst)}</td><td style="color:${COR_CAND[cands[0]?.n]}">${fmt(l.c0)}</td><td style="color:${COR_CAND[cands[1]?.n]}">${fmt(l.c1)}</td></tr>`).join('');
}

document.querySelectorAll('th').forEach(th => th.onclick = () => {
  const k = th.dataset.k;
  ordem = {k, d: ordem.k === k ? -ordem.d : (k === 'uf' ? 1 : -1)};
  desenhar();
});
document.getElementById('mApu').onclick = () => { modo='apu'; mApu.classList.add('on'); mLid.classList.remove('on'); desenhar(); };
document.getElementById('mLid').onclick = () => { modo='lid'; mLid.classList.add('on'); mApu.classList.remove('on'); desenhar(); };

montarMapa();
let falta = 0;
setInterval(() => {
  if (--falta <= 0) { falta = INTERVALO; atualizar(); }
  document.getElementById('cont').textContent = `próxima em ${falta}s`;
}, 1000);
falta = INTERVALO; atualizar();
</script>
</body>
</html>
